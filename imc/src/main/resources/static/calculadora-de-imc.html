<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
</head>
<div class="container">
    <h1>Calculadora de IMC</h1>
    <form id="imc-form">
        <label for="peso">Peso (kg):</label>
        <input type="number" placeholder="Ex: 80.5" id="peso" name="peso" required>

        <label for="altura">Altura (m):</label>
        <input type="number" placeholder="Ex: 1.75" id="altura" name="altura" step="0.01" required>

        <button type="submit" onblur="calcularIMC()">Calcular IMC</button>
    </form>
    <div id="resultado" class="resultado hidden"></div>
    <div id="erro" class="erro hidden"></div>
<body>
    <script src="calculadora-de-imc.js"></script>
</body>
</html>
